[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rce-pipeline"
version = "0.1.0"
description = "Extract chess moves with page geometry from PDF chess books into .rce archives"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "PyMuPDF>=1.24",
    "chess>=1.10",
]

[project.optional-dependencies]
# Only step 1c needs these, and only for a scan or a figurine font. They are
# kept out of the base install because a book with a usable text layer — which
# is every digitally produced one — never loads them.
glyphs = [
    "scikit-learn>=1.4",
    "scikit-image>=0.22",
    "numpy>=1.24",
    "pillow>=10.0",
]
dev = ["pytest>=8.0", "rce-pipeline[glyphs]"]

[tool.setuptools.packages.find]
include = ["rce_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

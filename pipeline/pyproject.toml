[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rce-pipeline"
version = "0.1.0"
description = "Extract chess moves with page geometry from PDF chess books into .rce archives"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "PyMuPDF>=1.24",
    "chess>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["rce_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
